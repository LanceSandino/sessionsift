name: sessionsift

x-runtime: &runtime
  image: sessionsift:2.1.1
  user: "${SESSIONSIFT_UID:-501}:${SESSIONSIFT_GID:-20}"
  init: true
  restart: unless-stopped
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=16m

services:
  agent:
    <<: *runtime
    build:
      context: .
    command: ["start"]
    environment:
      CODEX_HOME: /sources/codex
      SESSIONSIFT_HOME: /state
      SESSIONSIFT_ADDR: 0.0.0.0:7777
      SESSIONSIFT_ALLOW_DOCKER_TUNNEL: "true"
      SESSIONSIFT_TRUSTED_PROXY_IP: 172.30.77.1
      SESSIONSIFT_PUBLIC_URL: "${SESSIONSIFT_AGENT_PUBLIC_URL:-http://127.0.0.1:7777}"
    ports:
      - "127.0.0.1:7777:7777"
    volumes:
      - "${SESSIONSIFT_HOST_HOME:?set SESSIONSIFT_HOST_HOME}/.sessionsift:/state"
      - "${SESSIONSIFT_HOST_HOME:?set SESSIONSIFT_HOST_HOME}/.codex/sessions:/sources/codex/sessions:ro"
      - "${SESSIONSIFT_HOST_HOME:?set SESSIONSIFT_HOST_HOME}/.codex/archived_sessions:/sources/codex/archived_sessions:ro"
      - "${SESSIONSIFT_HOST_HOME:?set SESSIONSIFT_HOST_HOME}/.codex/state_5.sqlite:/sources/codex/state_5.sqlite:ro"
      - "${SESSIONSIFT_HOST_HOME:?set SESSIONSIFT_HOST_HOME}/.codex/state_5.sqlite-wal:/sources/codex/state_5.sqlite-wal:ro"
      - "${SESSIONSIFT_HOST_HOME:?set SESSIONSIFT_HOST_HOME}/.codex/state_5.sqlite-shm:/sources/codex/state_5.sqlite-shm:ro"
    networks:
      - agent-egress
    healthcheck:
      test: ["CMD", "/app/sessionsift", "healthcheck", "agent"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  agent-egress:
    ipam:
      config:
        - subnet: 172.30.77.0/29
          gateway: 172.30.77.1
