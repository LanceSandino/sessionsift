name: Bug report
description: Report a reproducible problem using synthetic data only
body:
  - type: markdown
    attributes:
      value: "Do not paste transcripts, exports, database contents, logs with private paths, credentials, tokens, recovery secrets, bridge keys, or private URLs. Report security issues through SECURITY.md instead."
  - type: input
    id: version
    attributes:
      label: SessionSift version
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Synthetic reproduction
      description: Use generated fixtures and remove private identifiers.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I confirmed this report contains no real conversation data, credentials, secrets, private URLs, or private paths.
          required: true
